# assuming caps lock <-> ctrl
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# neovim in popup
bind-key -r v display-popup -E -d "#{pane_current_path}" -w 100% -h 100% -y S "nvim ."

# lazygit in popup
bind-key -r g display-popup -E -d "#{pane_current_path}" -w 100% -h 100% -y S "lazygit"

# session picker in popup
bind-key -r f display-popup -E -w 100% -h 100% -y S "sessions"

# new panes open in existing directory
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

