# assuming caps lock <-> ctrl
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# neovim in popup
bind-key -r v display-popup -E -d "#{pane_current_path}" -w 100% -h 100% -y S "nvim ."

# lazygit in popup
bind-key -r g display-popup -E -d "#{pane_current_path}" -w 100% -h 100% -y S "lazygit"

# project session picker in popup (C-a p)
bind-key -r p display-popup -E -w 100% -h 100% -y S "sessions list-projects"

# create new project in popup (C-a P)
bind-key P display-popup -E -w 100% -h 100% -y S "sessions create-project"

# vim-tmux-navigator: seamless pane/split navigation with C-h/j/k/l
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# vi-style copy mode with system clipboard
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# last session toggle
bind-key L switch-client -l

# forward focus events to neovim so autoread triggers on pane switch
set -g focus-events on

# new panes open in existing directory
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

